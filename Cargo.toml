[workspace]
resolver = "2"
members = [
    "crates/bin",
    "crates/cache",
    "crates/cli",
    "crates/client",
    "crates/format",
    "crates/gql",
    "crates/manager",
    "crates/mcp-server",
    "crates/orm",
    "crates/proof-model-tests",
    "crates/reactor",
    "crates/relation",
    "crates/relation/derive",
    "crates/rug-shim",
    "crates/schema",
    "crates/schema/derive",
    "crates/sparql",
    "crates/sql",
    "crates/terminusdb",
    "crates/test",
    "crates/test/macros",
    "crates/turtle",
    "crates/types",
    "crates/typestate",
    "crates/woql-builder",
    "crates/woql-dsl",
    "crates/woql-js",
    "crates/woql2",
    "crates/woql-proof",
    "crates/xpath",
    "crates/xsd",
]

[workspace.dependencies]
# Core Rust libraries
anyhow = "1.0"
tap = "1.0"
serde = { version = "1.0", features = ["derive"] }
# arbitrary_precision: TerminusDB 12 returns high-precision xsd:decimal as native
# JSON numbers; without this, response parsing (from_str::<Value>) truncates them
# through f64 (e.g. 1/3 -> 0.33333333333333337). Feature-unifies workspace-wide.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.5.0", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Utility crates
itertools = "0.14"
derive-getters = "0.3.0"
derive_builder = "0.20.0"
pseudonym = "0.2.3"

# Decimal support
# bigdecimal: arbitrary-precision decimal for xsd:decimal model fields (v12 stores
# up to 256 digits, prints ~20). Preferred over rust_decimal's fixed ~28 digits.
bigdecimal = { version = "0.4", features = ["serde"] }

# Proc macro dependencies
darling = "0.20.3"
syn = "2.0"
proc-macro2 = "1.0"
quote = "1.0"

# Additional dependencies used by terminusdb modules
decimal-rs = { version = "0.1", features = ["serde"] }
enum_derive = "0.1.7" 
custom_derive = "0.1.7"
enum_variant_macros = "0.3.0"
exec_time = "0.1.4"
rayon = "1.5.3"
glob = "0.3.0"
async-stream = "0.3.3"
futures-util = "0.3.23"
http = "1"
urlencoding = "2.1.3"
url = "2.5.2"
tempfile = "3"
subprocess = "0.2.9"
hashable = "1.0"
sha2 = "0.10.8"
serde_canonical_json = "1.0.0"
pretty_assertions = "1.4.1"
refined = "0.3.1"
heck = "0.3.2"
regex = "1"
multihash = "0.19"
tracing-subscriber = "0.3"
regexm = "0.2.1"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["ParapluOU Team"]
license = "MIT OR Apache-2.0"
description = "Rust client library for TerminusDB"
repository = "https://github.com/ParapluOU/terminusdb-rs"
keywords = ["terminusdb", "database", "graph", "rdf", "semantic"]
categories = ["database", "api-bindings"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
# Pins matched to terminusdb-community @ v12.1.0-rc3-paraplu.3 (the fork's own
# main line, based on upstream v12.1.0-rc3). Keep in lockstep with crates/gql's terminusdb-community
# rev.
# One store lineage, reached by both routes. Our fork (version 0.23.1 on
# purpose, so this patch is semver-accepted) is a superset of upstream
# v0.23.1; the proving stack inside it is behind its opt-in `proof` feature, so
# a crate that only reads and writes triples compiles none of it.
#
# TWO patch tables are needed and neither is redundant: this one covers a
# crates-io `terminus-store` requirement, and the source patch below covers the
# direct git requirement that terminusdb-store-prolog and the grpc label-store
# client both declare. Patching per dependency instead leaves one of them on
# terminusdb-org, and then `GrpcLabelStore` implements THAT copy's `LabelStore`
# and stops satisfying ours — the failure is a trait bound, not a version
# conflict, so it reads like a code error rather than a resolution one.
terminus-store = { git = "https://github.com/ParapluOU/terminusdb-store", branch = "main" }
# Use pure Rust rug shim for cross-compilation (replaces GMP-based rug)
rug = { path = "crates/rug-shim" }
# swipl-rs as pinned by v12.1.0-rc3 (terminusdb-org).
swipl = { git = "https://github.com/terminusdb-org/swipl-rs", rev = "2fdd55ee360afc3657aca44e3bf04ca1f48b1c50" }
swipl-fli = { git = "https://github.com/terminusdb-org/swipl-rs", rev = "2fdd55ee360afc3657aca44e3bf04ca1f48b1c50" }
# tdb-succinct as pinned by v12.1.0-rc3. NB: the source spec must match the
# community crate's own `tag="v0.2.1"` EXACTLY, or cargo resolves two distinct
# copies and the shared types stop unifying (same trap as terminus-store below).
# Carries DateTimeInterval, required by terminusdb-store-prolog @ v12.1. The
# 0.2 line is not published, so this patch is also the only way the proof
# crates' and the store fork's `tdb-succinct = "0.2"` requirements resolve.
tdb-succinct = { git = "https://github.com/terminusdb-org/tdb-succinct", tag = "v0.2.1" }

# The other route to the store: terminusdb-store-prolog (reached through
# terminusdb-community) and terminusdb-grpc-labelstore-client both ask for
# terminusdb-org/terminusdb-store by git URL. Redirecting the SOURCE catches
# both, including the grpc client, whose manifest lives in a repository we do
# not control and therefore cannot edit.
# Our own crates, reached back through the fork. terminusdb-community depends on
# terminusdb-store-prolog, which depends on terminusdb-query-proof, which depends
# on these four BY GIT — it has to, since a path out of that repository cannot be
# resolved by anything consuming it as a git dependency. Without these patches
# cargo builds a second copy of each from that revision, and the moment a type
# from one meets a type from the other the error reads like a code bug rather
# than the resolution bug it is. Same trap as terminus-store, same fix.
[patch."https://github.com/ParapluOU/terminusdb-rs"]
terminusdb-woql2 = { path = "crates/woql2" }
terminusdb-woql-proof = { path = "crates/woql-proof" }
terminusdb-schema = { path = "crates/schema" }
terminusdb-schema-derive = { path = "crates/schema/derive" }

[patch."https://github.com/terminusdb-org/terminusdb-store"]
terminus-store = { git = "https://github.com/ParapluOU/terminusdb-store", branch = "main" }
