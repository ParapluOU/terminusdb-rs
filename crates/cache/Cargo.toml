[package]
name = "terminusdb-cache"
description = "Application-level derived values in Reactor's dependency graph: get-or-compute with observed invalidation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "terminusdb_cache"
path = "src/lib.rs"

[dependencies]
# The only workspace crate this needs. Dependency *terms* travel as opaque text,
# so nothing here links against the reactor: an application caches through the
# HTTP surface, exactly as a non-Rust one would.
terminusdb-client = { path = "../client" }

anyhow = { workspace = true }
async-trait = "0.1"
blake3 = "1"
bytes = "1"
dashmap = "5"
http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
