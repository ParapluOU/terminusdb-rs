[package]
name = "terminusdb-woql-proof"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Caller-selectable Blitzar MSM backend for the Dory G1 group. Proven byte-identical
# to the CPU backend; a backend swap must never change proof output.
blitzar-cpu = ["dory-pcs/blitzar-cpu", "terminus-store/blitzar-cpu"]
blitzar-gpu = ["dory-pcs/blitzar-gpu", "terminus-store/blitzar-gpu"]

[dependencies]
# The lightweight WOQL2 AST this compiler lowers.
terminusdb-woql2 = { path = "../woql2" }
terminusdb-schema = { path = "../schema" }
terminusdb-schema-derive = { path = "../schema/derive" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tap = "1.0"
decimal-rs = { version = "0.1.43", features = ["serde"] }
tracing = { workspace = true }
chrono = { workspace = true }
hex = { version = "0.4" }
sha2 = { workspace = true }
thiserror = { workspace = true }

# Authenticated Dory/sumcheck proof stack.
dory-pcs = { version = "0.4.1", path = "../../../dory", default-features = false, features = ["arkworks", "parallel"] }
tdb-succinct = { version = "0.1.2" }
terminus-store = { path = "../../../terminusdb-store-paraplu" }

# Exact PURE-RUST big rationals for the xsd:decimal/rational value layer (GMP-free so
# the compiler stays cross-compilable / WASM-friendly).
num-bigint = { version = "0.4" }
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }
num-integer = { version = "0.1" }
num-traits = { version = "0.2" }

[dev-dependencies]
serde_json = "1.0"
decimal-rs = { version = "0.1.43", features = ["serde"] }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
