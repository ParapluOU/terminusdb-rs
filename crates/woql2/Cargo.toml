[package]
name = "terminusdb-woql2"
version = "0.1.0"
edition = "2021"

# The Proof-of-WOQL compiler/executor was extracted into the `terminusdb-woql-proof`
# crate. This crate is now the lightweight WOQL2 AST only and pulls no cryptographic
# dependencies. Callers that want proving depend on `terminusdb-woql-proof`.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
terminusdb-schema = { path = "../schema" }
terminusdb-schema-derive = { path = "../schema/derive" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Added dependencies required by TerminusDBModel macro
anyhow = "1.0"
tap = "1.0"
derive_builder = "0.20.2"
decimal-rs = { version = "0.1.43", features = ["serde"] }
tracing = { workspace = true }
# Used by the RFC3339 date-literal macros in `macros.rs` (non-proof AST code).
chrono = { workspace = true }

[dev-dependencies]
serde_json = "1.0"
decimal-rs = { version = "0.1.43", features = ["serde"] }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
