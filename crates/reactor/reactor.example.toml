# Reactor — example configuration.
#
# One Reactor runs as a sidecar next to exactly one TerminusDB node. It talks to
# that node over localhost, tracks only that node's branch heads, and makes no
# claim about any other node. See docs/reactive-cache-design.md §5.7.

[node]
# Identity reported in the `X-Reactor-Node` response header and in metrics.
# Defaults to the hostname.
id = "tdb-reader-01"
# Where this Reactor listens. Point the load balancer here, not at TerminusDB.
listen = "0.0.0.0:6364"

[upstream]
# The local TerminusDB node. Must be local: Reactor assumes cheap, reliable
# access and issues extra pinned reads against it.
url = "http://localhost:6363"
# Credentials for Reactor's OWN requests (capture, fills, schema reads).
# Client requests are forwarded with the client's own Authorization header;
# Reactor never substitutes its credentials for a client's.
user = "admin"
pass = "root"
org = "admin"
# Cap on concurrent fill requests Reactor will have in flight upstream, so a
# commit that dirties thousands of fragments cannot stampede the node.
max_inflight_fills = 32
request_timeout_ms = 30000

[cache]
# Hot in-memory tier budget. Eviction is least-recently-read; an evicted
# fragment is simply refilled on demand (Noria-style partial state).
memory_budget_mb = 512
# Warm tier: a filesystem content-addressed store. Fragments are immutable and
# content-addressed, so pointing several nodes at the same NAS directory turns
# this into the shared tier from §5.7 mode 2 — with no coherence protocol,
# because nothing is ever updated in place. Comment out for a purely private,
# in-memory cache (§5.7 mode 1, the default recommendation).
# dir = "/var/lib/reactor/cas"
# Keep at most this many versions per fragment key. Older versions are dropped
# once no live reader is latched below them.
max_versions_per_key = 4
# Keep at most this many fragment keys per namespace. This is the bound nothing
# else provides: `memory_budget_mb` bounds cached bodies and
# `max_versions_per_key` bounds versions within one key, but neither bounds how
# many distinct keys exist — and because a document list is cached as one
# fragment per document, that grows with the number of documents read. Over the
# cap the least-recently-used keys are dropped, slot and dependency index
# together; the bodies stay in the content-addressed store, so an eviction costs
# a refill and nothing else. Reckon 1-2 KiB of metadata per key plus any inlined
# body, and watch `reactor_keys_evicted`.
max_tracked_keys = 50000
# A cacheable response larger than this is streamed through and not cached: we
# need the whole body in memory to hash it, and that is not worth it past a
# point. Bypassed and streaming responses are never buffered regardless.
max_cacheable_body_mb = 8
# Drop a cached version this many seconds after it was filled, whatever its
# dependencies say. 0 = never, which is the default and the intended operating
# point: term invalidation is primary, and a TTL cannot make a wrong dependency
# right — it only bounds how long a wrong one hurts. Set it if you use the
# opt-in WOQL conditions (X-Reactor-Invalidate-On), where naming too few classes
# is the caller's mistake to make; leave it at 0 for the surfaces Reactor proves
# for itself.
ttl_secs = 0
# Russian-doll decomposition: cache a document list as a membership spine over
# one fragment per document, so a field change to any single member costs one
# child refill instead of throwing the whole list away. The hot path for most
# applications is exactly `GET /api/document/<ns>?type=X`, so this is on by
# default. Turning it off falls back to caching each response as one blob, which
# is unconditionally byte-faithful — the escape hatch if composition ever
# returns bytes that differ from the origin's. If you need it, that is a bug;
# please say so rather than leaving it off.
decompose = true

[consistency]
# What to do when a request carries `X-Reactor-Min-Version: <commit>` and this
# node's watermark has not reached it yet:
#   "wait"        - block up to min_version_wait_ms, then fall through to origin
#   "fail"        - answer 412 Precondition Failed so the LB retries elsewhere
#                   (the right setting for read-after-write paths in a
#                   horizontally scaled, eventually-consistent cluster)
#   "serve-stale" - answer anyway, labelled via Cache-Status and Age
min_version_policy = "wait"
min_version_wait_ms = 500
# Hold a write's response until our watermark reaches the commit it produced, so
# a subsequent read on THIS node is read-your-writes. Costs the write a little
# latency. Set to 0 to disable.
write_fence_ms = 2000
# Cache keys deliberately contain no user, so a hit must not become an
# access-control bypass: before serving one, Reactor checks that the caller may
# read the namespace and memoizes that grant for this long. Successes only are
# cached — a just-granted capability must never be denied for the whole TTL,
# while a just-revoked one costs us at most this long (POST /_reactor/invalidate
# clears grants immediately if you need it sooner).
auth_ttl_secs = 30

[capture]
# How commits are noticed. Drivers are untrusted: the watermark only advances
# past a commit after a pinned read at that commit has succeeded here.
#   "poll"         - head-poll /api/log. The ONLY driver that works on a
#                    shared-disk reader node, where nothing commits locally and
#                    the GraphQL subscription is expected to be silent.
#   "subscription" - _ChangeSet over SSE. Low latency; needs a local commit path.
#   "both"         - subscription for latency, poll as the liveness backstop.
#                    The default, and the right answer when unsure.
#   "diff-log"     - read the server's per-commit diff log at
#                    /api/graphql/_difflog/<org>/<db>. Better than "poll"
#                    wherever the server has it, and not mainly for speed: a
#                    head poll only ever learns "the head is now X", so each
#                    event costs a log walk to find out what happened in
#                    between, and /api/log is O(depth) — 467ms at depth 261,
#                    growing. The feed hands over every intervening commit in
#                    order WITH its parent, so there is no gap to reconcile,
#                    and a poll with nothing to report opens no layer and
#                    reads no triple. A rewritten history (reset, rebase)
#                    comes back as a reported discontinuity instead of a head
#                    that appears to move backwards.
#                    THE DEFAULT. A server without the feed is detected by a
#                    probe and falls back to head polling with a warning, so
#                    an older node degrades to the previous behaviour instead
#                    of to silence. It is also cheaper than "both": capture
#                    already runs one task per namespace, this replaces the
#                    poll inside it, and it opens no SSE subscription.
driver = "diff-log"
poll_interval_ms = 150
# Interval for a namespace nothing has read for idle_after_ms.
#
# With a database per tenant most are idle most of the time, and polling every
# head every 150ms to notice commits nobody is waiting for is the whole cost of
# that layout. Staleness in a namespace nobody reads costs nothing — invariant 4
# means a lagging watermark serves an older snapshot rather than a wrong one —
# and the first read after a quiet spell is a miss that goes upstream anyway.
idle_poll_interval_ms = 5000
idle_after_ms = 30000
#
# Namespaces registered while the process runs, rather than listed in [[namespace]].
#
# An application that creates databases — a room, tenant or publication per
# database — cannot list them in this file, so it registers them through
# POST /_reactor/namespace (idempotent) or has Reactor adopt them on first read.
#
# auto_register inverts the safe default (invariant 6: an unknown route is
# forwarded, never cached), so it is off unless you ask. Turn it on when the set
# of databases is open; leave it off when it is known, because then an
# unexpected namespace is a bug rather than a tenant.
# auto_register = true
#
# Each tracked namespace costs a capture task, a writer and a schema index, so
# this is the knob that keeps a per-tenant layout from becoming a thousand poll
# loops. Over the cap, registration is refused — that database is proxied
# uncached — rather than evicting a namespace something may be using.
max_tracked_namespaces = 512
#
# Driver for namespaces registered at run time. Separate from [capture].driver,
# and "poll" by default, because of how the server keys subscriptions: a
# _ChangeSet cohort is (database, class, operation, selection, mode), so one
# subscription covers ONE database and there is no org-wide stream to attach to.
# A database per tenant would therefore want one SSE connection per tenant,
# against a server that caps them at 20 per user by default (raisable with
# TERMINUSDB_SSE_MAX_SUBSCRIPTIONS_PER_USER; Reactor authenticates as one user,
# so every namespace it subscribes to shares that budget). A slot is also never
# returned once its client goes away, so that is a lifetime budget and each
# resubscribe spends one (terminusdb/terminusdb#2673). The many-namespace case
# polls; a handful named above can subscribe.
dynamic_driver = "diff-log"
# Above this many changed documents in one commit, stop paying for a per-commit
# /api/diff and fire coarse terms instead. Over-invalidation is a performance
# bug; under-invalidation is a correctness bug.
diff_threshold = 2000
# Walk at most this many commits when recovering a gap before giving up and
# treating it as a non-fast-forward (which drops the namespace's local state).
max_gap_walk = 500

# Namespaces to track. A namespace not listed here is proxied but never cached,
# which is the safe default for an unknown database.
[[namespace]]
org = "admin"
db = "people"
branch = "main"
# Per-namespace override of [capture].driver, e.g. "poll" on a reader node.
# driver = "poll"
# "lazy"  - fill on demand (default)
# "eager" - NOT IMPLEMENTED and refused at startup: invalidation drops an entry
#           and the next reader refills it. The engine-side policy plumbing
#           exists; the refill queue does not.
policy = "lazy"

[analyze]
# When an analyzer cannot prove a tight dependency it must pick a coarser one.
# strict = true makes it bypass the cache instead, trading hit rate for the
# smallest possible blast radius. Recommended while rolling out.
strict = false
# Cache GraphQL query responses. Requires injecting `_id`/`_type` into every
# selection set so responses can be mapped back to documents.
graphql = true
# Cache read-only WOQL. Any query containing a write op anywhere is forwarded.
woql = true
# Requests pinned to a commit are immutable and cached forever. This is the
# zero-risk case; there is no reason to turn it off.
pinned = true

[predicates]
# A GraphQL filter that is more than a single `eq` — a range, an `_and`, a
# `_not` — is indexed as a *predicate*: on every commit the writer decides,
# from the whole before and after document, whether each change moved a
# document into or out of the set. A field edit that does not cross the
# boundary then invalidates nothing, which is what makes a filtered list (and
# the counts over it) survive unrelated writes.
#
# The work is CPU, it runs on a worker pool, and the commit path WAITS for it:
# the watermark must never advance past invalidations we have not applied, or
# `X-Reactor-Head` would claim currency we do not have. So these bounds are
# really latency bounds. Over either one the commit invalidates every predicate
# on the classes it touched instead — coarse, bounded, and counted as
# `reactor_predicate_evaluations_skipped`. Raise them if that counter climbs and
# `reactor_watermark_lag_ms` has room; lower them if the lag does not.
max_evaluations_per_commit = 50000
max_predicates = 5000
# 0 = one thread per core.
workers = 0

[observability]
# Serve from cache AND re-execute against the local node at the same pinned
# commit, comparing bytes, reporting divergence with the dependency trace.
# NOT IMPLEMENTED: anything other than 0.0 is refused at startup rather than
# accepted and ignored. This is the one audit that would turn "we believe the
# invalidation is sound" into "we measured it", so it is the top of the
# improvement list — see README 'Known gaps'.
shadow_sample_rate = 0.0
log_level = "info"
